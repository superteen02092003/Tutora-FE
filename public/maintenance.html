  <title>TopTutor — Hệ thống đang được nâng cấp</title>
  <meta name="description"
    content="TopTutor đang trong quá trình bảo trì và nâng cấp hệ thống. Vui lòng quay lại sau ít phút." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --color-cream: #faf9f6;
      --color-cream-light: #f2f0e4;
      --color-navy: #1a2238;
      --color-burgundy: #631b1b;
      --color-gold: #d4b483;
      --color-navy-60: rgba(26, 34, 56, 0.6);
      --color-navy-05: rgba(26, 34, 56, 0.05);
      --font-primary: "Bricolage Grotesque", system-ui, sans-serif;
      --font-serif: "IBM Plex Serif", Georgia, serif;
      --radius-full: 9999px;
      --radius-lg: 21px;
      --shadow-soft: 0px 20px 50px -12px rgba(26, 34, 56, 0.08);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--color-cream);
      color: var(--color-navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 520px;
      height: 520px;
      background: var(--color-cream-light);
      top: -180px;
      left: -160px;
    }

    body::after {
      width: 480px;
      height: 480px;
      background: rgba(212, 180, 131, 0.35);
      bottom: -180px;
      right: -160px;
    }

    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 21px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 auto 32px;
      width: fit-content;
    }

    .logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .logo-text {
      font-family: var(--font-primary);
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -0.5px;
      color: var(--color-navy);
      text-transform: uppercase;
    }

    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10.5px;
      padding: 6px 18px 7px;
      background-color: var(--color-navy-05);
      border-radius: var(--radius-full);
      margin: 0 auto 28px;
      width: fit-content;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--color-burgundy);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .badge-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-navy);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.55;
        transform: scale(1.25);
      }
    }

    .title {
      font-family: var(--font-primary);
      font-size: clamp(2.5rem, 1.75rem + 2.5vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.08;
      text-transform: uppercase;
      color: var(--color-navy);
      margin: 0 0 24px;
    }

    .title-line {
      display: block;
    }

    .title-accent {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 500;
      color: var(--color-burgundy);
      text-transform: lowercase;
    }

    .description {
      font-family: var(--font-serif);
      font-size: clamp(1rem, 0.9rem + 0.4vw, 1.3125rem);
      font-style: italic;
      line-height: 1.55;
      color: var(--color-navy);
      max-width: 560px;
      margin: 0 auto 36px;
    }

    .info-card {
      background: #ffffff;
      border: 1px solid var(--color-navy-05);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      box-shadow: var(--shadow-soft);
      max-width: 520px;
      margin: 0 auto;
      text-align: left;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      color: var(--color-navy);
    }

    .info-row+.info-row {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--color-navy-05);
    }

    .info-icon {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-navy-05);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .info-label {
      font-weight: 600;
      color: var(--color-navy);
      margin-right: 6px;
    }

    .info-link {
      color: var(--color-burgundy);
      text-decoration: none;
      font-weight: 600;
    }

    .info-link:hover {
      text-decoration: underline;
    }

    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px 21px 32px;
      font-size: 13px;
      color: var(--color-navy-60);
    }

    @media (max-width: 480px) {
      .page {
        padding: 32px 16px;
      }

      .info-card {
        padding: 20px;
      }

      .title {
        letter-spacing: -1.2px;
      }
    }
  </style>
</head>
